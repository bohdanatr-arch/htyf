<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Robux Rewards — Scratch Cards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Reward pop-in animation */
        @keyframes popIn {
            0% { transform: scale(0.85); opacity: 0.5; }
            60% { transform: scale(1.04); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .reward-pop {
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* Twinkling sparkles */
        @keyframes twinkle {
            0%, 100% { opacity: 0.4; transform: scale(0.85) rotate(0deg); }
            50% { opacity: 1; transform: scale(1.15) rotate(15deg); }
        }

        .sparkle {
            animation: twinkle 2s infinite ease-in-out;
        }

        .sparkle-delay-1 { animation-delay: 0.4s; }
        .sparkle-delay-2 { animation-delay: 0.9s; }
        .sparkle-delay-3 { animation-delay: 1.4s; }

        /* Smooth fade-out of the scratch canvas upon full reveal */
        .canvas-fade-out {
            transition: opacity 0.45s ease-out, transform 0.45s ease-out;
            opacity: 0;
            transform: scale(1.05);
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-black text-zinc-100 min-h-screen flex flex-col items-center justify-center p-4 sm:p-6 overflow-x-hidden relative">

    <!-- Background image with light overlay for brightness -->
    <div 
        class="fixed inset-0 z-0 bg-cover bg-center bg-no-repeat brightness-110"
        style="background-image: url('https://i.postimg.cc/RCN8yPR4/4d5531ecd0f8bf9ae947ae7f81502bce.jpg');"
    ></div>
    <div class="fixed inset-0 z-0 bg-black/30"></div>

    <!-- Fireworks & Confetti Overlay Canvas -->
    <canvas id="fireworks-canvas" class="fixed inset-0 z-40 pointer-events-none w-full h-full"></canvas>

    <!-- Main interactive scratch card area -->
    <main class="relative z-10 flex flex-col items-center justify-center w-full max-w-md">
        
        <div class="flex flex-col items-center text-center mb-6">
            <img 
                src="https://i.postimg.cc/x8JLTV4w/Roblox-Logo.png" 
                alt="Roblox Logo" 
                class="h-32 sm:h-40 w-auto max-w-[90vw] object-contain mb-3 brightness-0 invert"
                onerror="this.style.display='none'"
            />
            <h1 class="text-3xl sm:text-4xl font-extrabold text-white tracking-wider uppercase">SCRATCH AND WIN</h1>
        </div>

        <!-- Scratch card container -->
        <div id="card-wrapper" class="relative w-[310px] h-[310px] sm:w-[340px] sm:h-[340px] rounded-[34px] shadow-[0_20px_50px_rgba(0,0,0,0.85)] border border-zinc-800 overflow-hidden bg-white select-none transition-transform duration-300">
            
            <!-- Bottom layer (Prize underneath the scratch coating) -->
            <div id="prize-layer" class="absolute inset-0 w-full h-full flex flex-col justify-between bg-white overflow-hidden">
                
                <!-- Top section: Warm golden sky, clouds, and Robux coin -->
                <div class="relative w-full h-[58%] bg-gradient-to-b from-[#FDE68A] via-[#FCD34D] to-[#FBBF24]/80 flex items-center justify-center overflow-hidden">
                    
                    <!-- Decorative sparkles -->
                    <svg class="sparkle absolute top-7 left-10 w-6 h-6 text-[#F59E0B]" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2L14.2 9.8L22 12L14.2 14.2L12 22L9.8 14.2L2 12L9.8 9.8L12 2Z"/>
                    </svg>
                    <svg class="sparkle sparkle-delay-1 absolute top-14 left-6 w-3 h-3 text-[#D97706]" viewBox="0 0 24 24" fill="currentColor">
                        <circle cx="12" cy="12" r="8"/>
                    </svg>
                    <svg class="sparkle sparkle-delay-2 absolute top-10 right-14 w-5 h-5 text-[#F59E0B]" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2L14.2 9.8L22 12L14.2 14.2L12 22L9.8 14.2L2 12L9.8 9.8L12 2Z"/>
                    </svg>
                    <svg class="sparkle sparkle-delay-3 absolute bottom-12 right-8 w-4 h-4 text-[#D97706]" viewBox="0 0 24 24" fill="currentColor">
                        <ellipse cx="12" cy="12" rx="10" ry="5" transform="rotate(-30 12 12)"/>
                    </svg>

                    <!-- Central golden Robux coin -->
                    <div class="relative z-10 w-24 h-24 sm:w-28 sm:h-28 flex items-center justify-center -mt-3">
                        <img 
                            src="https://i.postimg.cc/mg0Nckst/Znimok-ekrana-2026-11-24-o-20-51-49.png" 
                            alt="Robux Coin" 
                            class="w-full h-full object-contain drop-shadow-[0_8px_16px_rgba(217,119,6,0.35)]"
                            onerror="this.src='https://placehold.co/112x112/FBBF24/78350F?text=R$'"
                        />
                    </div>

                    <!-- Fluffy white clouds divider -->
                    <svg class="absolute -bottom-1 left-0 w-full h-14 text-white" viewBox="0 0 400 70" preserveAspectRatio="none">
                        <path fill="currentColor" d="M0,70 L0,45 Q30,20 75,38 Q125,10 185,35 Q245,8 305,36 Q355,18 400,42 L400,70 Z"/>
                    </svg>
                </div>

                <!-- Bottom section: 50000 + Robux coin currency & Robux prize subtitle -->
                <div class="relative w-full h-[42%] bg-white flex flex-col items-center justify-center px-6 pb-4 pt-1 text-center">
                    <div class="flex items-center justify-center gap-2">
                        <span id="prize-amount" class="text-4xl sm:text-[42px] font-extrabold tracking-tight text-slate-900 leading-none">
                            50000
                        </span>
                        <img 
                            src="https://i.postimg.cc/mg0Nckst/Znimok-ekrana-2026-11-24-o-20-51-49.png" 
                            alt="Robux" 
                            class="w-8 h-8 sm:w-9 sm:h-9 object-contain"
                            onerror="this.src='https://placehold.co/36x36/FBBF24/78350F?text=R$'"
                        />
                    </div>
                    <p id="prize-subtitle" class="text-base sm:text-lg font-medium text-slate-500 mt-1.5">
                        Robux prize
                    </p>
                </div>
            </div>

            <!-- Top layer: Interactive scratch canvas -->
            <canvas id="scratch-canvas" class="absolute inset-0 w-full h-full cursor-pointer z-20 touch-none"></canvas>

            <!-- "New" badge in the top-right corner -->
            <div id="new-badge" class="absolute top-4 right-4 z-30 pointer-events-none bg-[#B9F6CA] text-[#064E3B] text-xs font-bold px-3.5 py-1 rounded-full shadow-sm transition-opacity duration-300">
                New
            </div>
        </div>

        <!-- Roblox Username Claim Form (shown after reveal) -->
        <div id="claim-form-container" class="hidden w-full max-w-[310px] sm:max-w-[340px] mt-5 bg-zinc-900/95 border border-zinc-800 rounded-2xl p-4 shadow-xl transition-all">
            <div id="claim-input-section">
                <label for="roblox-username" class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-2">
                    Enter your Roblox Username
                </label>
                <div class="flex flex-col gap-2.5">
                    <input 
                        type="text" 
                        id="roblox-username" 
                        placeholder="e.g. Builderman" 
                        autocomplete="off"
                        class="w-full px-4 py-3 rounded-xl bg-black border border-zinc-700 text-white placeholder-zinc-500 text-sm font-medium focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition"
                    />
                    <button 
                        id="claim-robux-btn" 
                        type="button"
                        class="w-full py-3.5 px-6 rounded-xl bg-gradient-to-r from-emerald-500 to-green-600 hover:from-emerald-400 hover:to-green-500 active:scale-[0.98] text-white font-bold text-base shadow-lg shadow-emerald-600/30 transition-all flex items-center justify-center gap-2"
                    >
                        <span>Claim 50,000 Robux</span>
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
                        </svg>
                    </button>
                </div>
                <p id="claim-feedback" class="hidden text-xs font-medium mt-2.5 text-center"></p>
            </div>

            <!-- DONE Celebration State (shown after submitting username) -->
            <div id="claim-done-section" class="hidden flex flex-col items-center justify-center py-3 text-center">
                <div class="w-14 h-14 rounded-full bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center mb-2.5 text-emerald-400">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
                    </svg>
                </div>
                <div class="text-3xl font-black tracking-widest text-emerald-400 uppercase drop-shadow-[0_0_12px_rgba(16,185,129,0.5)]">
                    DONE
                </div>
                <p id="done-username-text" class="text-xs font-medium text-zinc-300 mt-1.5"></p>
            </div>
        </div>

        <!-- Action buttons below the card -->
        <div id="actions-container" class="mt-4 flex flex-col items-center justify-center w-full gap-2">
            <button id="next-card-btn" class="hidden w-full max-w-[310px] sm:max-w-[340px] py-3 px-6 rounded-xl bg-slate-800/80 hover:bg-slate-800 active:scale-[0.98] text-slate-300 font-semibold text-sm border border-slate-700/80 transition-all flex items-center justify-center gap-2">
                <span>Try Another Card</span>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6"/>
                </svg>
            </button>

            <button id="quick-reveal-btn" class="text-xs font-medium text-slate-500 hover:text-slate-300 transition py-2 px-4 rounded-xl">
                Reveal automatically
            </button>
        </div>
    </main>

    <script>
        /**
         * Game state and DOM elements initialization
         */
        const canvas = document.getElementById('scratch-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const cardWrapper = document.getElementById('card-wrapper');
        const newBadge = document.getElementById('new-badge');
        const prizeAmountEl = document.getElementById('prize-amount');
        const prizeSubtitleEl = document.getElementById('prize-subtitle');
        const nextCardBtn = document.getElementById('next-card-btn');
        const quickRevealBtn = document.getElementById('quick-reveal-btn');
        const claimFormContainer = document.getElementById('claim-form-container');
        const claimInputSection = document.getElementById('claim-input-section');
        const claimDoneSection = document.getElementById('claim-done-section');
        const doneUsernameText = document.getElementById('done-username-text');
        const robloxUsernameInput = document.getElementById('roblox-username');
        const claimRobuxBtn = document.getElementById('claim-robux-btn');
        const claimFeedback = document.getElementById('claim-feedback');
        const fireworksCanvas = document.getElementById('fireworks-canvas');
        const fwCtx = fireworksCanvas.getContext('2d');

        // Fireworks animation engine
        let particles = [];
        let fireworksActive = false;

        function resizeFireworksCanvas() {
            fireworksCanvas.width = window.innerWidth;
            fireworksCanvas.height = window.innerHeight;
        }
        resizeFireworksCanvas();
        window.addEventListener('resize', resizeFireworksCanvas);

        function createFireworkBurst(x, y) {
            const colors = ['#10B981', '#FBBF24', '#34D399', '#F59E0B', '#FFFFFF', '#60A5FA', '#F472B6'];
            const count = 55;
            for (let i = 0; i < count; i++) {
                const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.2;
                const speed = 2.5 + Math.random() * 6.5;
                particles.push({
                    x,
                    y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    alpha: 1,
                    decay: 0.014 + Math.random() * 0.015,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    size: 2.5 + Math.random() * 3
                });
            }
        }

        function animateFireworks() {
            if (!fireworksActive && particles.length === 0) return;
            fwCtx.clearRect(0, 0, fireworksCanvas.width, fireworksCanvas.height);

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.08; // gravity
                p.vx *= 0.98;
                p.alpha -= p.decay;

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                } else {
                    fwCtx.save();
                    fwCtx.globalAlpha = p.alpha;
                    fwCtx.fillStyle = p.color;
                    fwCtx.beginPath();
                    fwCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    fwCtx.fill();
                    fwCtx.restore();
                }
            }

            if (particles.length > 0 || fireworksActive) {
                requestAnimationFrame(animateFireworks);
            }
        }

        function launchFireworksShow() {
            fireworksActive = true;
            const w = fireworksCanvas.width;
            const h = fireworksCanvas.height;

            // Launch multiple bursts across the screen
            const burstTimes = [0, 300, 650, 1000, 1400, 1850];
            burstTimes.forEach((delay) => {
                setTimeout(() => {
                    const bx = w * (0.2 + Math.random() * 0.6);
                    const by = h * (0.15 + Math.random() * 0.45);
                    createFireworkBurst(bx, by);
                    if (delay === 0) animateFireworks();
                }, delay);
            });

            setTimeout(() => {
                fireworksActive = false;
            }, 2200);
        }

        // Web Audio API sound synthesizer (no external audio URLs)
        let audioCtx = null;
        let lastScratchSoundTime = 0;

        function playScratchSound() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const now = audioCtx.currentTime;
                if (now - lastScratchSoundTime < 0.06) return;
                lastScratchSoundTime = now;

                const bufferSize = audioCtx.sampleRate * 0.04;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.4));
                }

                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 1800 + Math.random() * 600;

                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.06, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);
                noise.start(now);
            } catch (e) {}
        }

        function playWinSound() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                const now = audioCtx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.07);
                    
                    gain.gain.setValueAtTime(0.001, now + idx * 0.07);
                    gain.gain.linearRampToValueAtTime(0.12, now + idx * 0.07 + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.07 + 0.35);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + idx * 0.07);
                    osc.stop(now + idx * 0.07 + 0.36);
                });
            } catch (e) {}
        }

        // Robux prize pool
        const PRIZE_POOL = [
            { amount: 50000, label: 'Robux prize' }
        ];

        let state = {
            currentPrize: null,
            isDrawing: false,
            isRevealed: false,
            lastPoint: null,
            strokeCounter: 0
        };

        /**
         * Draw the Roblox Gift Card style scratch cover:
         * Tilted grid of dark game thumbnails, "Gift Card" header, and large metallic white Roblox square
         */
        function drawScratchCover(width, height) {
            ctx.globalCompositeOperation = 'source-over';
            ctx.clearRect(0, 0, width, height);

            // Deep dark base
            ctx.fillStyle = '#09090B';
            ctx.fillRect(0, 0, width, height);

            const scale = width / 340;
            ctx.save();
            ctx.scale(scale, scale);

            // 1. Tilted grid of colorful game-like tiles (darkened like an official Roblox Gift Card)
            ctx.save();
            ctx.translate(170, 170);
            ctx.rotate(-0.26); // Same tilt angle as the Roblox logo

            const tilePalettes = [
                ['#1E3A8A', '#3B82F6', '#93C5FD'], // Obby / Sky blue
                ['#14532D', '#22C55E', '#86EFAC'], // Tycoon / Nature green
                ['#581C87', '#A855F7', '#F472B6'], // Neon / Disco purple
                ['#7C2D12', '#F97316', '#FDE047'], // Adventure / Sunset gold
                ['#164E63', '#06B6D4', '#67E8F9'], // Sci-Fi / Cyber cyan
                ['#881337', '#F43F5E', '#FDA4AF'], // Action / Ruby red
                ['#312E81', '#6366F1', '#C7D2FE'], // Galaxy / Indigo
                ['#3F6212', '#84CC16', '#FEF08A']  // Simulator / Lime
            ];

            const tileSize = 78;
            const gap = 8;
            const step = tileSize + gap;
            let colorIdx = 0;

            for (let row = -3; row <= 3; row++) {
                for (let col = -3; col <= 3; col++) {
                    const tx = col * step - tileSize / 2;
                    const ty = row * step - tileSize / 2;
                    const pal = tilePalettes[colorIdx % tilePalettes.length];
                    colorIdx++;

                    ctx.save();
                    ctx.beginPath();
                    ctx.roundRect(tx, ty, tileSize, tileSize, 10);
                    ctx.clip();

                    // Tile sky/background gradient
                    const tGrad = ctx.createLinearGradient(tx, ty, tx + tileSize, ty + tileSize);
                    tGrad.addColorStop(0, pal[0]);
                    tGrad.addColorStop(1, pal[1]);
                    ctx.fillStyle = tGrad;
                    ctx.fillRect(tx, ty, tileSize, tileSize);

                    // Stylized game world shapes inside each tile
                    ctx.fillStyle = pal[2];
                    ctx.globalAlpha = 0.7;
                    ctx.beginPath();
                    ctx.arc(tx + tileSize * 0.68, ty + tileSize * 0.32, 14, 0, Math.PI * 2);
                    ctx.fill();

                    // Stylized terrain / buildings
                    ctx.fillStyle = '#18181B';
                    ctx.globalAlpha = 0.4;
                    ctx.fillRect(tx + 8, ty + tileSize * 0.55, 22, tileSize * 0.45);
                    ctx.fillRect(tx + 36, ty + tileSize * 0.42, 28, tileSize * 0.58);

                    // Subtle dark overlay so colors stay vibrant while center logo & text pop
                    ctx.globalAlpha = 0.25;
                    ctx.fillStyle = '#09090B';
                    ctx.fillRect(tx, ty, tileSize, tileSize);

                    ctx.restore();
                }
            }
            ctx.restore();

            // Soft vignette around edges so colors stay bright
            const radGrad = ctx.createRadialGradient(170, 175, 60, 170, 170, 235);
            radGrad.addColorStop(0, 'rgba(9, 9, 11, 0.05)');
            radGrad.addColorStop(1, 'rgba(9, 9, 11, 0.45)');
            ctx.fillStyle = radGrad;
            ctx.fillRect(0, 0, 340, 340);

            // 2. "Gift Card" white title at the top
            ctx.save();
            ctx.font = '600 28px Inter, sans-serif';
            ctx.fillStyle = '#FFFFFF';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = 'rgba(0, 0, 0, 0.75)';
            ctx.shadowBlur = 10;
            ctx.fillText('Gift Card', 170, 44);
            ctx.restore();

            // 3. Large central metallic silver-white Roblox tilted square logo
            ctx.save();
            ctx.translate(170, 182);
            ctx.rotate(-0.26);

            const outerSize = 152;
            const innerSize = 42;
            const halfOuter = outerSize / 2;
            const halfInner = innerSize / 2;

            // Drop shadow behind the Roblox square
            ctx.shadowColor = 'rgba(0, 0, 0, 0.75)';
            ctx.shadowBlur = 22;
            ctx.shadowOffsetY = 8;

            // Metallic white-to-silver gradient matching official gift cards
            const logoGrad = ctx.createLinearGradient(-halfOuter, -halfOuter, halfOuter, halfOuter);
            logoGrad.addColorStop(0, '#FFFFFF');
            logoGrad.addColorStop(0.55, '#E4E4E7');
            logoGrad.addColorStop(1, '#A1A1AA');

            ctx.fillStyle = logoGrad;
            ctx.beginPath();
            ctx.rect(-halfOuter, -halfOuter, outerSize, outerSize);
            ctx.rect(-halfInner, -halfInner, innerSize, innerSize);
            ctx.fill('evenodd');

            // Crisp inner bevel highlight
            ctx.shadowColor = 'transparent';
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
            ctx.lineWidth = 2;
            ctx.strokeRect(-halfInner, -halfInner, innerSize, innerSize);

            ctx.restore();
            ctx.restore();
        }

        function drawRobloxTiltedSquare(cx, cy, size, rotation) {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(rotation);
            const half = size / 2;
            const hole = size * 0.28;
            ctx.beginPath();
            ctx.rect(-half, -half, size, size);
            ctx.rect(-hole / 2, -hole / 2, hole, hole);
            ctx.fill('evenodd');
            ctx.restore();
        }

        function drawRobloxHead(cx, cy, r, rotation) {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(rotation);
            // Stud on top
            ctx.fillRect(-r * 0.35, -r * 1.15, r * 0.7, r * 0.3);
            // Rounded blocky head
            ctx.beginPath();
            ctx.roundRect(-r * 0.85, -r * 0.85, r * 1.7, r * 1.7, 8);
            ctx.lineWidth = 4;
            ctx.stroke();
            // Classic eyes & smile
            ctx.beginPath();
            ctx.arc(-r * 0.3, -r * 0.15, 2.5, 0, Math.PI * 2);
            ctx.arc(r * 0.3, -r * 0.15, 2.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(0, r * 0.15, r * 0.35, 0.15 * Math.PI, 0.85 * Math.PI);
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.restore();
        }

        function drawRobloxBrick(cx, cy, w, h, rotation) {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(rotation);
            // Two studs on top
            ctx.fillRect(-w * 0.32, -h / 2 - 5, w * 0.22, 5);
            ctx.fillRect(w * 0.1, -h / 2 - 5, w * 0.22, 5);
            // Brick body
            ctx.beginPath();
            ctx.roundRect(-w / 2, -h / 2, w, h, 4);
            ctx.fill();
            ctx.restore();
        }

        function drawRobloxGamepad(cx, cy, size, rotation) {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(rotation);
            ctx.beginPath();
            ctx.roundRect(-size * 0.8, -size * 0.45, size * 1.6, size * 0.9, 10);
            ctx.lineWidth = 4;
            ctx.stroke();
            // D-pad
            ctx.fillRect(-size * 0.45, -size * 0.18, 4, size * 0.36);
            ctx.fillRect(-size * 0.45 - size * 0.14 + 2, -2, size * 0.36, 4);
            // Action buttons
            ctx.beginPath();
            ctx.arc(size * 0.32, -size * 0.1, 3, 0, Math.PI * 2);
            ctx.arc(size * 0.48, size * 0.1, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function drawRobuxHexagon(cx, cy, radius, rotation) {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(rotation);
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const angle = (Math.PI / 3) * i - Math.PI / 2;
                const x = Math.cos(angle) * radius;
                const y = Math.sin(angle) * radius;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.lineWidth = 6;
            ctx.stroke();

            const inner = radius * 0.36;
            ctx.fillRect(-inner / 2, -inner / 2, inner, inner);
            ctx.restore();
        }

        /**
         * Set up a fresh card with Retina/mobile DPR scaling
         */
        function setupNewCard() {
            state.isRevealed = false;
            state.isDrawing = false;
            state.lastPoint = null;
            state.strokeCounter = 0;

            const randomPrize = PRIZE_POOL[Math.floor(Math.random() * PRIZE_POOL.length)];
            state.currentPrize = randomPrize;

            prizeAmountEl.textContent = `${randomPrize.amount}`;
            prizeSubtitleEl.textContent = randomPrize.label;

            canvas.classList.remove('canvas-fade-out');
            newBadge.style.opacity = '1';
            nextCardBtn.classList.add('hidden');
            quickRevealBtn.classList.remove('hidden');
            claimFormContainer.classList.add('hidden');
            claimInputSection.classList.remove('hidden');
            claimDoneSection.classList.add('hidden');
            robloxUsernameInput.value = '';
            claimFeedback.classList.add('hidden');
            claimRobuxBtn.disabled = false;
            claimRobuxBtn.classList.remove('opacity-60', 'cursor-not-allowed');

            const rect = cardWrapper.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);

            drawScratchCover(rect.width, rect.height);
        }

        function getPointerPos(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX, clientY;

            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function scratchAt(point) {
            if (state.isRevealed) return;

            ctx.globalCompositeOperation = 'destination-out';
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineWidth = 46;

            ctx.beginPath();
            if (state.lastPoint) {
                ctx.moveTo(state.lastPoint.x, state.lastPoint.y);
                ctx.lineTo(point.x, point.y);
            } else {
                ctx.moveTo(point.x, point.y);
                ctx.lineTo(point.x + 0.1, point.y + 0.1);
            }
            ctx.stroke();

            state.lastPoint = point;
            state.strokeCounter++;
            playScratchSound();

            if (state.strokeCounter % 8 === 0) {
                checkScratchPercentage();
            }
        }

        function checkScratchPercentage() {
            if (state.isRevealed) return;

            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const pixels = imageData.data;
            let transparentPixels = 0;
            const step = 16 * 4;
            let totalSampled = 0;

            for (let i = 3; i < pixels.length; i += step) {
                totalSampled++;
                if (pixels[i] < 128) {
                    transparentPixels++;
                }
            }

            const scratchedRatio = transparentPixels / totalSampled;

            if (scratchedRatio > 0.42) {
                revealFullCard();
            }
        }

        function revealFullCard() {
            if (state.isRevealed) return;
            state.isRevealed = true;

            canvas.classList.add('canvas-fade-out');
            newBadge.style.opacity = '0';
            quickRevealBtn.classList.add('hidden');
            claimFormContainer.classList.remove('hidden');
            claimFormContainer.classList.add('reward-pop');
            nextCardBtn.classList.remove('hidden');

            cardWrapper.classList.add('reward-pop');
            setTimeout(() => {
                cardWrapper.classList.remove('reward-pop');
                claimFormContainer.classList.remove('reward-pop');
            }, 500);

            playWinSound();
        }

        // Handle Roblox username claim submission
        claimRobuxBtn.addEventListener('click', () => {
            const username = robloxUsernameInput.value.trim();
            claimFeedback.classList.remove('hidden', 'text-rose-400', 'text-emerald-400');

            if (username.length < 3 || username.length > 20) {
                claimFeedback.textContent = 'Please enter a valid Roblox username (3–20 characters).';
                claimFeedback.classList.add('text-rose-400');
                robloxUsernameInput.focus();
                return;
            }

            playWinSound();
            launchFireworksShow();

            claimInputSection.classList.add('hidden');
            claimDoneSection.classList.remove('hidden');
            claimDoneSection.classList.add('reward-pop');
            doneUsernameText.textContent = `50,000 Robux sent to @${username}`;
        });

        // Mouse and touch event listeners
        canvas.addEventListener('mousedown', (e) => {
            state.isDrawing = true;
            state.lastPoint = getPointerPos(e);
            scratchAt(state.lastPoint);
        });

        window.addEventListener('mousemove', (e) => {
            if (!state.isDrawing) return;
            scratchAt(getPointerPos(e));
        });

        window.addEventListener('mouseup', () => {
            state.isDrawing = false;
            state.lastPoint = null;
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            state.isDrawing = true;
            state.lastPoint = getPointerPos(e);
            scratchAt(state.lastPoint);
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!state.isDrawing) return;
            scratchAt(getPointerPos(e));
        }, { passive: false });

        canvas.addEventListener('touchend', () => {
            state.isDrawing = false;
            state.lastPoint = null;
        });

        nextCardBtn.addEventListener('click', () => {
            setupNewCard();
        });

        quickRevealBtn.addEventListener('click', () => {
            revealFullCard();
        });

        window.addEventListener('resize', () => {
            if (!state.isRevealed) {
                setupNewCard();
            }
        });

        window.onload = () => {
            setupNewCard();
        };
    </script>
</body>
</html>
